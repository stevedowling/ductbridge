# ductbridge configuration. Command-line options override these.

# Serial device. Prefer the stable /dev/serial/by-id/... path, which does not
# change if other USB serial devices are plugged in.
port = "/dev/ttyUSB0"

# "listen-only" never transmits. Switch to "active" only once the monitor
# shows clean traffic and the original tablet is unplugged.
mode = "listen-only"

# error, warn, info or debug (debug logs every frame).
log_level = "info"

# HTTP API (the tablet's port-2025 API, used by Home Assistant and apps).
# "off" disables it. In listen-only mode it is read-only.
http_bind = "0.0.0.0:2025"

# Names shown by apps. The original tablet stored these; they are not on the
# bus. zone_names lists zone 1 first; blank entries become "Zone N".
system_name = "ductbridge"
aircon_name = "Aircon"
zone_names = ""

# Stable system id. Home Assistant uses it as the device's unique id, and the
# phone app as the system's mid, so do not change it after setup.
system_id = "ductbridge"

# System type reported to apps (system.sysType). The official app refuses
# types it does not know. If it still says "unable to determine system type",
# use the value your original tablet reports: sysType in
# http://<tablet-ip>:2025/getSystemData (e.g. "MyAir5" or "e-zone").
sys_type = "MyAir5"

# Tablet software revisions reported to apps (system.myAppRev and
# system.aaServiceRev). Lower values than the current tablet software make
# the official app offer an upgrade. To silence that after an app update,
# copy the values from your original tablet's getSystemData.
my_app_rev = "15.1548"
aa_service_rev = "14.118"

# Climate control, MyAuto and quiet night settings reported to apps. Some
# original tablets do not report them; check for climateControlModeEnabled,
# myAutoModeEnabled and quietNightModeEnabled in your tablet's
# getSystemData. "false" leaves them out, so Home Assistant offers no MyTemp
# or MyAuto preset and no night mode switch, as with that tablet. Turn all
# three off before setting "false": hiding them does not stop them running.
advertise_features = true

# Tablet-side state: names set from apps (they override the names above),
# on/off timers, and climate control / MyAuto / quiet night settings.
# "off" keeps it in memory only.
state_file = "/var/lib/ductbridge/state.json"
