[package]
name = "ductbridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Open replacement for a ducted air-conditioning zone controller wall tablet (RS-485)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ductbridge"
path = "src/bin/ductbridge.rs"

[[bin]]
name = "ductbridge-monitor"
path = "src/bin/ductbridge-monitor.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }

[profile.release]
lto = true
strip = true
