name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build-pi:
    # 64-bit Raspberry Pi OS (Pi 3/4/5)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach binaries to releases
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - uses: actions/upload-artifact@v4
        with:
          name: ductbridge-aarch64
          path: |
            target/aarch64-unknown-linux-gnu/release/ductbridge
            target/aarch64-unknown-linux-gnu/release/ductbridge-monitor
            packaging/
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/aarch64-unknown-linux-gnu/release/ductbridge
            target/aarch64-unknown-linux-gnu/release/ductbridge-monitor
            packaging/ductbridge.service
            packaging/ductbridge.conf
